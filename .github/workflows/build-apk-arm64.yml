# 放入 xiaoyaocz/dart_simple_live 的 .github/workflows/build-apk-arm64.yml
# 作用：GitHub 云端编译 Simple Live 的 Android arm64-v8a debug APK（本地零环境）
name: build-apk-arm64

on:
  # 手动触发：Actions 页右上角 "Run workflow"
  workflow_dispatch: {}
  # 推 master 自动出包
  push:
    branches: [master]

jobs:
  apk-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout (整仓, 因 simple_live_core 是 path 依赖)
        uses: actions/checkout@v4

      # JDK 17（Gradle 8.12 / Kotlin DSL 需要）
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK license（非交互全量接受，避免卡交互）
      - name: Accept Android licenses
        run: yes | "$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)" --licenses >/dev/null 2>&1 || true

      # Flutter（.fvmrc 锁定 3.38.3）
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.3'

      - name: Flutter doctor
        working-directory: simple_live_app
        run: flutter doctor -v || true

      # path 依赖要求 app 与 core 平级，所以在仓库根 pub get
      - name: pub get
        working-directory: simple_live_app
        run: flutter pub get

      # 项目 bug 规避：app/build.gradle.kts 的 release signingConfig 在 Gradle 配置阶段
      # 就执行 `keystoreProperties["keyAlias"] as String`，而 key.properties（作者本地签名）
      # 未提交仓库 → null 强转 String 崩溃，debug 也编不动。补一个 dummy 文件占位即可
      # （debug 包不走 release 签名，占位值不影响产物；用 printf 避免 heredoc 在 Actions 的缩进坑）
      - name: Provide dummy key.properties
        working-directory: simple_live_app/android
        run: |
          [ -f key.properties ] && { echo "key.properties exists, skip"; exit 0; }
          printf 'storePassword=dummy\nkeyPassword=dummy\nkeyAlias=dummy\nstoreFile=dummy.keystore\n' > key.properties
          echo "created dummy key.properties"

      # 第三方插件(auto_orientation_v2 / dynamic_color 等)的 android/build.gradle(.kts)
      # 是为 AGP9 写的（顶层 kotlin{...} 块 / classpath AGP9.4.1 / compileSdkVersion 36），
      # 在 Flutter 3.38 的 AGP8.9.1 下编译不过。pub get 后统一 patch pub-cache 里所有
      # 插件 gradle：删顶层 kotlin{} 块、AGP 9.4.1->8.9.1、compileSdk 36->35。
      # 逻辑见 ci/patch_plugins.py（作为仓库文件提交，避免 heredoc 缩进坑）。
      - name: Patch all plugin gradle for AGP 8
        run: python3 ci/patch_plugins.py

      # 只出 arm64-v8a 单架构 debug apk（免签名，手机可直接装；不产 universal/其余架构）
      - name: Build arm64-v8a debug APK
        working-directory: simple_live_app
        run: flutter build apk --target-platform android-arm64 --debug

      # 上传 arm64-v8a debug apk（glob 匹配 + 找不到就报错，杜绝假 success）
      # 注意：Flutter 3.38 的 debug 包产物名是 app-debug.apk（单 target-platform
      # android-arm64 时也只含 arm64-v8a 的 .so，但不带 ABI 后缀），故 glob 用 *.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-live-arm64
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
